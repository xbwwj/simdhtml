[package]
name = "simdhtml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fast read-only HTML parsing into a preorder FlatDoc"

[features]
# Exposes crate internals to the microbenchmarks. Do not use in normal builds.
bench-internal = []
# Internal feature for external parse-only comparisons. Do not use in normal builds.
bench-external = ["dep:html5ever_039", "dep:markup5ever_rcdom"]

[dependencies]
bitflags = "2"
entities = "1"
html5ever_039 = { package = "html5ever", version = "0.39", optional = true }
markup5ever_rcdom = { version = "0.39", optional = true }
memchr.workspace = true
simdutf8 = "0.1"

[dev-dependencies]
proptest = "1"

[[bench]]
name = "stage1"
path = "benches/stage1.rs"
harness = false

[[bench]]
name = "classify"
path = "benches/classify.rs"
harness = false

[[bench]]
name = "raw"
path = "benches/raw.rs"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "html5ever_compare"
path = "benches/html5ever_compare.rs"
harness = false
required-features = ["bench-external"]
