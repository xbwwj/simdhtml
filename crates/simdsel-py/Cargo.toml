[package]
name = "simdsel-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bindings for simdsel"

[lib]
name = "_simdsel"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
regex-lite = "0.1"
self_cell = "1.3"
simdhtml = { path = "../simdhtml" }
simdsel = { path = "../simdsel" }
