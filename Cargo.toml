[workspace]
members = [
    "crates/simdhtml",
    "crates/simdsel",
    "crates/simdsel-py",
    "bench",
]
default-members = [
    "crates/simdhtml",
    "crates/simdsel",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
simdhtml = { path = "crates/simdhtml" }
simdsel = { path = "crates/simdsel" }

# Parsing and text processing
entities = "1"
html5ever_039 = { package = "html5ever", version = "0.39" }
markup5ever_rcdom = "0.39"
memchr = "2"
simdutf8 = "0.1"
flate2 = "1"
warc = "0.4"

# SIMD and data structures
bitflags = "2"
rustc-hash = "2"

# Selector and HTML comparison
dom_query = "0.29"
scraper = { version = "0.27", default-features = false }

# Python bindings
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
# Embedding CPython in the bench binary: no extension-module, auto-initialize.
pyo3-embed = { package = "pyo3", version = "0.30", features = ["auto-initialize"] }

# Error handling
thiserror = "2.0.21"

# Testing and benchmarking
proptest = "1"
criterion = "0.8"
serde = "1"
serde_json = "1"
libfuzzer-sys = "0.4"

encoding_rs = "0.8.44"
