[workspace]
members = [
  "crates/corpus",
  "crates/simdhtml",
  "crates/simdsel",
  "crates/simdsel-py",
  "bench",
]
default-members = [
  "crates/simdhtml",
  "crates/simdsel",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bitflags = "2"
criterion = "0.8"
dom_query = "0.29"
encoding_rs = "0.8.44"
entities = "1"
flate2 = "1"
html5ever_039 = { package = "html5ever", version = "0.39" }
markup5ever_rcdom = "0.39"
memchr = "2"
proptest = "1"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
pyo3-embed = { package = "pyo3", version = "0.30", features = ["auto-initialize"] }
rustc-hash = "2"
scraper = { version = "0.27", default-features = false }
serde = "1"
serde_json = "1"
simdutf8 = "0.1"
thiserror = "2.0.21"
warc = "0.4"

# internal crates

simdhtml = { path = "crates/simdhtml" }
simdhtml-corpus = { path = "crates/corpus" }
simdsel = { path = "crates/simdsel" }
