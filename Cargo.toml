[workspace]
members = [
    "crates/simdhtml",
    "crates/simdsel",
    "crates/simdsel-py",
    "fuzz",
]
default-members = [
    "crates/simdhtml",
    "crates/simdsel",
    "crates/simdsel-py",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
memchr = "2"
