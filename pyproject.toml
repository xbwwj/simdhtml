[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "simdsel"
dynamic = ["version"]
description = "Fast HTML parsing and CSS/XPath selection (parsel-compatible subset)"
readme = "crates/simdsel-py/README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Xubai Wang", email = "xubaiwwj@gmail.com" }]
keywords = ["html", "parser", "css", "xpath", "scraping", "simd", "parsel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.urls]
Homepage = "https://github.com/xbwwj/simdhtml"
Repository = "https://github.com/xbwwj/simdhtml"
Issues = "https://github.com/xbwwj/simdhtml/issues"
Benchmarks = "https://github.com/xbwwj/simdhtml#benchmarks"

[dependency-groups]
dev = ["maturin>=1.9,<2.0"]
bench = [
    "parsel>=1.10",
    "selectolax>=1.0",
    "beautifulsoup4>=4.12",
]
test = [
    "pytest>=8",
    "parsel>=1.10",
    "lxml>=5",
]

[tool.maturin]
manifest-path = "crates/simdsel-py/Cargo.toml"
module-name = "simdsel._simdsel"
python-source = "crates/simdsel-py/python"
bindings = "pyo3"
strip = true
