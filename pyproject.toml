[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "simdsel"
version = "0.1.0"
description = "Fast HTML parsing and CSS selection (parsel-compatible subset)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "simdsel authors" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[dependency-groups]
dev = ["maturin>=1.7,<2.0"]
bench = [
    "parsel>=1.10",
    "selectolax>=1.0",
    "lxml>=5.0",
    "cssselect>=1.2",
]

[tool.maturin]
manifest-path = "crates/simdsel-py/Cargo.toml"
module-name = "simdsel._simdsel"
python-source = "crates/simdsel-py/python"
bindings = "pyo3"
strip = true
